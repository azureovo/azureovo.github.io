<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>腾讯IEG实习证明 — Z7A的个人空间</title>
<style>
  :root {
    --bg: #0a0a12;
    --text: #f5efe2;
    --accent: #52adc8;
    --gold: #f5b642;
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height: 100vh; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Nav */
  .nav {
    position: fixed; top:0; left:0; right:0; z-index:100;
    padding: 12px 24px; display: flex; align-items: center; gap: 24px;
    background: linear-gradient(180deg, rgba(10,10,18,0.94) 0%, transparent 100%);
    pointer-events: none;
  }
  .nav a { color: #888; text-decoration: none; font-size: 14px; pointer-events: auto; transition: color .2s; }
  .nav a:hover { color: #fff; }
  .nav a.brand { color: #fff; font-weight: 600; font-size: 16px; margin-right: auto; }

  /* Starfield layer */
  .stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }

  /* Content */
  .content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 100px 24px 60px;
  }

  h1 {
    font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 900;
    letter-spacing: -0.02em; margin-bottom: 0.3rem;
    text-align: center;
    text-shadow: 0 0 40px rgba(82,173,200,0.4);
  }
  .subtitle {
    color: rgba(255,255,255,0.5); font-size: 0.9rem;
    margin-bottom: 0.8rem; text-align: center;
  }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 16px; color: var(--accent); font-weight: 600; font-size: 0.85rem;
    text-decoration: none; border: 1px solid var(--accent);
    border-radius: 999px; transition: all .2s; margin-bottom: 2rem;
  }
  .back-link:hover { background: var(--accent); color: #fff; }

  .cert-wrap {
    position: relative; max-width: 800px; width: 100%;
    border-radius: 20px; overflow: hidden;
    box-shadow:
      0 0 60px rgba(82,173,200,0.15),
      0 0 120px rgba(245,182,66,0.1),
      0 20px 60px rgba(0,0,0,0.5);
  }
  .cert-wrap img {
    width: 100%; height: auto; display: block;
  }

  @media (max-width:600px) {
    .nav { padding: 8px 14px; gap: 12px; }
    .nav a { font-size: 12px; }
    .nav a.brand { font-size: 14px; }
    .content { padding-top: 80px; }
  }
</style>
</head>
<body>

<canvas class="stars" id="starCanvas"></canvas>

<nav class="nav">
  <a href="https://azureovo.github.io/" class="brand">Z7A的个人空间</a>
  <a href="https://azureovo.github.io/">Home</a>
  <a href="https://azureovo.github.io/3dscene/">3DGS</a>
  <a href="https://azureovo.github.io/cv/">CV</a>
</nav>

<div class="content">
  <h1>✨ 腾讯IEG 实习证明</h1>
  <p class="subtitle">技术中台 · 服务拓展组 · 技术产品</p>
  <a href="/" class="back-link">← 返回首页</a>

  <div class="cert-wrap">
    <img src="/images/tencent-internship.png" alt="腾讯IEG实习证明">
  </div>
</div>

<script>
/* ── Sparkle Starfield ── */
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
let stars = [];
const STAR_COUNT = 200;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/* Colors palette */
const colors = ['#52adc8','#f5b642','#fff','#a78bfa','#f472b6','#5ce2c7','#facc15','#93c5fd'];

class Star {
  constructor() {
    this.reset(true);
  }
  reset(initial) {
    this.x = Math.random() * canvas.width;
    this.y = initial ? Math.random() * canvas.height : -10;
    this.r = Math.random() * 1.8 + 0.4;
    this.speed = Math.random() * 0.6 + 0.15;
    this.opacity = Math.random() * 0.9 + 0.1;
    this.twinkle = Math.random() * Math.PI * 2;
    this.twinkleSpeed = Math.random() * 0.04 + 0.01;
    this.color = colors[Math.floor(Math.random() * colors.length)];
  }
  update() {
    this.y += this.speed;
    this.twinkle += this.twinkleSpeed;
    if (this.y > canvas.height + 10) this.reset(false);
  }
  draw(ctx) {
    const alpha = this.opacity * (0.6 + 0.4 * Math.sin(this.twinkle));
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = alpha;
    ctx.fill();

    /* Glow */
    if (this.r > 1) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = this.color;
      ctx.globalAlpha = alpha * 0.15;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

for (let i = 0; i < STAR_COUNT; i++) stars.push(new Star());

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => { s.update(); s.draw(ctx); });
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
