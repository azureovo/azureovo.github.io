<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icare — Z7A的游戏世界</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕊️</text></svg>">
<meta name="description" content="Icare — A 3D Dreamworld Adventure by World Labs, powered by Spark 2.0. 浏览器内实时3D梦境冒险游戏。">
<style>
  :root {
    --bg: #020203;
    --muted: #7a8288;
    --accent: #6366f1;
  }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  html, body { width: 100%; height: 100%; overflow: hidden; background: #020203; }

  /* ── Top bar ── */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 8px 14px; display: flex; align-items: center; gap: 16px;
    background: rgba(2,2,3,0.72); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    transition: opacity 0.4s;
  }
  .top-bar a { color: rgba(248,246,240,0.7); text-decoration: none; font-size: 13px; transition: color .2s; }
  .top-bar a:hover { color: #f8f6f0; }
  .top-bar a.brand { color: #f8f6f0; font-weight: 600; font-size: 14px; margin-right: auto; }
  .top-bar .game-title { font-size: 12px; color: rgba(248,246,240,0.45); font-style: italic; }

  /* ── Iframe ── */
  iframe.game-frame {
    position: fixed; inset: 0; width: 100%; height: 100%;
    border: none; z-index: 1;
  }

  /* ── Loading overlay ── */
  .loading-cover {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(22, 24, 35, 0.74) 0%, rgba(6, 7, 10, 0.88) 38%, rgba(0, 0, 1, 1) 86%),
      linear-gradient(180deg, #11131d 0%, #050608 48%, #000000 100%);
    color: #f8f6f0;
    font-family: 'Gilda Display', Georgia, serif;
    font-size: clamp(22px, 5vw, 36px);
    transition: opacity 0.8s ease;
    pointer-events: none;
  }
  .loading-cover.loaded { opacity: 0; }
  .loading-cover .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(248,246,240,0.6);
    margin-left: 12px; animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
  }
</style>
</head>
<body>

<div class="top-bar" id="topBar">
  <a href="https://azureovo.github.io/" class="brand">Z7A的个人空间</a>
  <a href="https://azureovo.github.io/3dscene/game/">← 游戏列表</a>
  <a href="https://azureovo.github.io/3dscene/">3DGS Hub</a>
  <span class="game-title">Icare · A 3D Dreamworld Adventure</span>
</div>

<iframe class="game-frame"
  id="gameFrame"
  src="https://www.icare-game.world/"
  title="Icare — A 3D Dreamworld Adventure"
  allow="accelerometer; autoplay; clipboard-write; cross-origin-isolated; gamepad; gyroscope; microphone; web-share"
  allowfullscreen
  sandbox="allow-scripts allow-same-origin allow-popups">
</iframe>

<div class="loading-cover" id="loadingCover">
  Icare<div class="pulse"></div>
</div>

<script>
const cover = document.getElementById('loadingCover');
const frame = document.getElementById('gameFrame');
const bar = document.getElementById('topBar');

frame.addEventListener('load', function() {
  setTimeout(function() {
    cover.classList.add('loaded');
    setTimeout(function() { cover.remove(); }, 800);
  }, 1500);
});

// Auto-hide top bar after idle
let hideTimer;
function resetTimer() {
  bar.style.opacity = '1';
  clearTimeout(hideTimer);
  hideTimer = setTimeout(function() { bar.style.opacity = '0'; }, 4000);
}
bar.addEventListener('mouseenter', function() { bar.style.opacity = '1'; clearTimeout(hideTimer); });
bar.addEventListener('mouseleave', function() { hideTimer = setTimeout(function() { bar.style.opacity = '0'; }, 2000); });
bar.addEventListener('touchstart', resetTimer);
document.addEventListener('mousemove', function(e) {
  if (e.clientY < 56) bar.style.opacity = '1';
});
</script>

</body>
</html>
