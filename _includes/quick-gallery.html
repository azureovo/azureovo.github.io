<style>
.life-slider {
  --card-width: 280px;
  --card-height: 380px;
  --card-transition-duration: 800ms;
  --card-transition-easing: ease;
  position: relative;
  width: 100%; min-height: 520px;
  display: flex; align-items: center; gap: 2rem;
  margin-top: 1.5rem; padding: 1rem 0;
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
.life-slider .slider-bg { display: none; }
.life-slider .card-area {
  position: relative; flex: 1 1 auto;
  min-width: calc(var(--card-width) * 1.4 + 80px);
  height: var(--card-height);
  display: flex; justify-content: center; align-items: center;
}
.life-slider .cards-wrapper {
  position: relative; width: 100%; height: 100%;
  perspective: 1200px;
}
.life-slider .life-card {
  --card-translateY-offset: 100vh;
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%,-50%)
    translateX(var(--card-translateX-offset))
    translateY(var(--card-translateY-offset))
    rotateY(var(--card-rotation-offset))
    scale(var(--card-scale-offset));
  display: inline-block;
  width: var(--card-width); height: var(--card-height);
  transition: transform var(--card-transition-duration) var(--card-transition-easing);
  user-select: none;
  border-radius: 8px; overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  opacity: 0; pointer-events: none;
}
.life-slider .life-card::before { display: none; }
.life-slider .life-card img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.life-slider .life-card.current {
  --card-translateX-offset: 0;
  --card-rotation-offset: 0;
  --card-scale-offset: 1;
  opacity: 1; pointer-events: auto;
}
.life-slider .life-card.prev {
  --card-translateX-offset: calc(-1 * var(--card-width) * 1.05);
  --card-rotation-offset: 20deg;
  --card-scale-offset: 0.85;
  opacity: 0.5; pointer-events: none;
}
.life-slider .life-card.next {
  --card-translateX-offset: calc(var(--card-width) * 1.05);
  --card-rotation-offset: -20deg;
  --card-scale-offset: 0.85;
  opacity: 0.5; pointer-events: none;
}
.life-slider .info-area {
  flex: 0 0 auto; min-width: 180px;
  padding-right: 1rem;
}
.life-slider .info-area .info-text {
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color: var(--text-color, #494e52);
  transition: opacity 0.4s, transform 0.4s;
}
.life-slider .info-area .info-name {
  font-size: 1.8rem; font-weight: 900; letter-spacing: 0.02em;
  margin-bottom: 8px; color: #2c3e50;
}
.life-slider .info-area .info-tag {
  font-size: 1rem; font-weight: 600; opacity: 0.8; margin-bottom: 4px;
}
.life-slider .slider-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  z-index: 30; width: 44px; height: 44px;
  border: none; background: rgba(0,0,0,0.06);
  border-radius: 50%;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.3s;
}
.life-slider .slider-btn:hover { background: rgba(0,0,0,0.14); }
.life-slider .slider-btn svg { width: 22px; height: 22px; fill: none; stroke: #555; stroke-width: 2.5; }
.life-slider .btn-left { left: 4px; }
.life-slider .btn-right { right: 4px; }
@media (max-width:768px) {
  .life-slider {
    --card-width: 200px; --card-height: 280px;
    flex-direction: column; min-height: 440px; gap: 1rem;
  }
  .life-slider .card-area { min-width: 0; width: 100%; }
  .life-slider .info-area { text-align: center; padding-right: 0; }
  .life-slider .info-name { font-size: 1.4rem; }
  .life-slider .info-tag { font-size: 0.9rem; }
  .life-slider .info-desc { font-size: 0.8rem; }
  .life-slider .btn-left { left: 0; }
  .life-slider .btn-right { right: 0; }
}
</style>

<div class="life-slider" id="lifeSlider">
  <div class="slider-bg" id="sliderBg"></div>
  <div class="card-area">
    <div class="cards-wrapper" id="cardsWrapper"></div>
  </div>
  <div class="info-area">
    <div class="info-text info-name" id="infoName"></div>
    <div class="info-text info-tag" id="infoTag"></div>
  </div>
  <button class="slider-btn btn-left" id="btnLeft" aria-label="Previous">
    <svg viewBox="0 0 24 24"><polyline points="15 4 7 12 15 20"/></svg>
  </button>
  <button class="slider-btn btn-right" id="btnRight" aria-label="Next">
    <svg viewBox="0 0 24 24"><polyline points="9 4 17 12 9 20"/></svg>
  </button>
</div>

<script>
(function(){
var cards=[
  {img:"/images/quick-gallery/drink.jpg",name:"喝酒",tag:"🍺 偶尔微醺"},
  {img:"/images/quick-gallery/bike.jpg",name:"骑车",tag:"🚴 自由骑行"},
  {img:"/images/quick-gallery/hotpot.jpg",name:"火锅",tag:"🍲 无辣不欢"},
  {img:"/images/quick-gallery/hiking.jpg",name:"爬山",tag:"⛰️ 登高望远"},
  {img:"/images/quick-gallery/disco.jpg",name:"蹦迪",tag:"🎵 放飞自我"},
  {img:"/images/quick-gallery/outdoor.jpg",name:"户外",tag:"🏕️ 热爱自然"},
  {img:"/images/quick-gallery/travel.jpg",name:"旅行",tag:"✈️ 丈量世界"}
];
var idx=0;
var wrapper=document.getElementById("cardsWrapper");
var nameEl=document.getElementById("infoName");
var tagEl=document.getElementById("infoTag");

function build(){
  cards.forEach(function(c,i){
    var div=document.createElement("div");
    div.className="life-card";
    if(i===0) div.classList.add("current");
    if(i===1) div.classList.add("next");
    if(i===cards.length-1) div.classList.add("prev");
    div.innerHTML='<img src="'+c.img+'" alt="'+c.name+'" loading="lazy">';
    wrapper.appendChild(div);
  });
  updateInfo(0);
}
function render(){
  var all=wrapper.querySelectorAll(".life-card");
  for(var i=0;i<all.length;i++){
    all[i].className="life-card";
    var pos=(i-idx+cards.length)%cards.length;
    if(pos===0) all[i].classList.add("current");
    if(pos===1) all[i].classList.add("next");
    if(pos===cards.length-1) all[i].classList.add("prev");
  }
  updateInfo(idx);
}
function updateInfo(i){
  nameEl.style.opacity=0; nameEl.style.transform="translateY(12px)";
  tagEl.style.opacity=0; tagEl.style.transform="translateY(12px)";
  setTimeout(function(){
    nameEl.textContent=cards[i].name;
    tagEl.textContent=cards[i].tag;
    nameEl.style.opacity=1; nameEl.style.transform="translateY(0)";
    tagEl.style.opacity=1; tagEl.style.transform="translateY(0)";
  },200);
}
document.getElementById("btnLeft").addEventListener("click",function(){
  idx=(idx-1+cards.length)%cards.length; render();
});
document.getElementById("btnRight").addEventListener("click",function(){
  idx=(idx+1)%cards.length; render();
});
build();
setTimeout(function(){
  var all=wrapper.querySelectorAll(".life-card");
  for(var i=0;i<all.length;i++){
    all[i].style.setProperty("--card-translateY-offset","0%");
  }
},200);
})();
</script>
