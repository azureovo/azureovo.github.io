<style>
.life-slider {
  --card-width: 200px;
  --card-height: 300px;
  --card-transition-duration: 800ms;
  --card-transition-easing: ease;
  position: relative;
  width: 100%; min-height: 560px;
  background: rgba(0,0,0,0.85);
  display: flex; justify-content: center; align-items: center;
  overflow: hidden; border-radius: 16px; margin-top: 1.5rem;
  font-family: 'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;
}
.life-slider .slider-bg {
  position: absolute; inset: 0; z-index: 1;
  filter: blur(8px); pointer-events: none; overflow: hidden;
}
.life-slider .slider-bg::before {
  content: ""; position: absolute; inset: 0;
  background: #000; z-index: 2; opacity: 0.8;
}
.life-slider .slider-bg img {
  position: absolute; width: 180%; height: 180%; object-fit: cover;
  left: 50%; top: 50%; transform: translate(-50%,-50%);
  opacity: 0; transition: opacity 1s ease;
}
.life-slider .slider-bg img.active { opacity: 1; }
.life-slider .card-area {
  position: relative; z-index: 10;
  width: calc(3 * var(--card-width)); height: 100%;
}
.life-slider .cards-wrapper {
  position: relative; width: 100%; height: 100%;
  perspective: 1000px;
}
.life-slider .life-card {
  --card-translateY-offset: 100vh;
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%,-50%)
    translateX(var(--card-translateX-offset))
    translateY(var(--card-translateY-offset))
    rotateY(var(--card-rotation-offset))
    scale(var(--card-scale-offset));
  display: inline-block;
  width: var(--card-width); height: var(--card-height);
  transition: transform var(--card-transition-duration) var(--card-transition-easing);
  user-select: none;
}
.life-slider .life-card::before {
  content: ""; position: absolute; inset: 0; z-index: 1;
  background: #000;
  transition: opacity var(--card-transition-duration) var(--card-transition-easing);
  opacity: calc(1 - var(--opacity));
}
.life-slider .life-card img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.life-slider .life-card.current {
  --card-translateX-offset: 0;
  --card-rotation-offset: 0;
  --card-scale-offset: 1.2;
  --opacity: 0.8;
}
.life-slider .life-card.prev {
  --card-translateX-offset: calc(-1 * var(--card-width) * 1.1);
  --card-rotation-offset: 25deg;
  --card-scale-offset: 0.9;
  --opacity: 0.4;
}
.life-slider .life-card.next {
  --card-translateX-offset: calc(var(--card-width) * 1.1);
  --card-rotation-offset: -25deg;
  --card-scale-offset: 0.9;
  --opacity: 0.4;
}
.life-slider .info-area {
  position: absolute; z-index: 20;
  left: calc(50% + var(--card-width) * 0.55);
  bottom: 15%;
  pointer-events: none;
}
.life-slider .info-area .info-text {
  font-family: "Montserrat",-apple-system,BlinkMacSystemFont,sans-serif;
  color: #fff; white-space: nowrap;
  transition: opacity 0.4s, transform 0.4s;
}
.life-slider .info-area .info-name {
  font-size: 1.6rem; font-weight: 800; text-transform: uppercase; margin-bottom: 6px;
}
.life-slider .info-area .info-tag {
  font-size: 0.8rem; font-weight: 600; opacity: 0.7;
  margin-bottom: 4px;
}
.life-slider .info-area .info-desc {
  font-size: 0.7rem; font-weight: 500; opacity: 0.5;
}
.life-slider .slider-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  z-index: 30; width: 44px; height: 44px;
  border: none; background: rgba(255,255,255,0.08);
  backdrop-filter: blur(8px); border-radius: 50%;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.3s;
}
.life-slider .slider-btn:hover { background: rgba(255,255,255,0.18); }
.life-slider .slider-btn svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 3; }
.life-slider .btn-left { left: 24px; }
.life-slider .btn-right { right: 24px; }
@media (max-width:800px) {
  .life-slider { --card-width: 140px; --card-height: 220px; min-height: 400px; }
  .life-slider .info-area { bottom: 8%; left: 10%; }
  .life-slider .info-name { font-size: 1.2rem; }
  .life-slider .info-tag { font-size: 0.7rem; }
  .life-slider .info-desc { font-size: 0.65rem; }
}
@media (max-width:500px) {
  .life-slider { --card-width: 110px; --card-height: 180px; min-height: 340px; }
  .life-slider .btn-left { left: 4px; }
  .life-slider .btn-right { right: 4px; }
}
</style>

<div class="life-slider" id="lifeSlider">
  <div class="slider-bg" id="sliderBg"></div>
  <div class="card-area">
    <div class="cards-wrapper" id="cardsWrapper"></div>
  </div>
  <div class="info-area">
    <div class="info-text info-name" id="infoName"></div>
    <div class="info-text info-tag" id="infoTag"></div>
    <div class="info-text info-desc" id="infoDesc"></div>
  </div>
  <button class="slider-btn btn-left" id="btnLeft" aria-label="Previous">
    <svg viewBox="0 0 24 24"><polyline points="15 4 7 12 15 20"/></svg>
  </button>
  <button class="slider-btn btn-right" id="btnRight" aria-label="Next">
    <svg viewBox="0 0 24 24"><polyline points="9 4 17 12 9 20"/></svg>
  </button>
</div>

<script>
(function(){
var cards=[
  {img:"/images/quick-gallery/drink.jpg",name:"喝酒",tag:"🍺 偶尔微醺",desc:"生活需要一点微醺"},
  {img:"/images/quick-gallery/bike.jpg",name:"骑车",tag:"🚴 自由骑行",desc:"风与自由的味道"},
  {img:"/images/quick-gallery/hotpot.jpg",name:"火锅",tag:"🍲 无辣不欢",desc:"没有什么是一顿火锅解决不了的"},
  {img:"/images/quick-gallery/hiking.jpg",name:"爬山",tag:"⛰️ 登高望远",desc:"山顶的风景最值得"},
  {img:"/images/quick-gallery/disco.jpg",name:"蹦迪",tag:"🎵 放飞自我",desc:"今夜不设防"},
  {img:"/images/quick-gallery/outdoor.jpg",name:"户外",tag:"🏕️ 热爱自然",desc:"逃离城市喧嚣"},
  {img:"/images/quick-gallery/travel.jpg",name:"旅行",tag:"✈️ 丈量世界",desc:"用脚步丈量每一寸土地"}
];
var idx=0;
var wrapper=document.getElementById("cardsWrapper");
var bg=document.getElementById("sliderBg");
var nameEl=document.getElementById("infoName");
var tagEl=document.getElementById("infoTag");
var descEl=document.getElementById("infoDesc");

function build(){
  cards.forEach(function(c,i){
    var div=document.createElement("div");
    div.className="life-card";
    if(i===0) div.classList.add("current");
    if(i===1) div.classList.add("next");
    if(i===cards.length-1) div.classList.add("prev");
    div.innerHTML='<img src="'+c.img+'" alt="'+c.name+'" loading="lazy">';
    wrapper.appendChild(div);
    var bgImg=document.createElement("img");
    bgImg.src=c.img; bgImg.alt=c.name;
    if(i===0) bgImg.classList.add("active");
    bg.appendChild(bgImg);
  });
  updateInfo(0);
}
function getByClass(c){
  var all=wrapper.querySelectorAll(".life-card");
  var a=[];
  for(var i=0;i<all.length;i++){
    if(all[i].classList.contains(c)) a.push(i);
  }
  return a;
}
function render(){
  var all=wrapper.querySelectorAll(".life-card");
  var bgImgs=bg.querySelectorAll("img");
  for(var i=0;i<all.length;i++){
    all[i].className="life-card";
    var pos=(i-idx+cards.length)%cards.length;
    if(pos===0) all[i].classList.add("current");
    if(pos===1) all[i].classList.add("next");
    if(pos===cards.length-1) all[i].classList.add("prev");
  }
  for(var j=0;j<bgImgs.length;j++){
    bgImgs[j].classList.remove("active");
  }
  bgImgs[idx].classList.add("active");
  updateInfo(idx);
}
function updateInfo(i){
  nameEl.style.opacity=0; nameEl.style.transform="translateY(20px)";
  tagEl.style.opacity=0; tagEl.style.transform="translateY(20px)";
  descEl.style.opacity=0; descEl.style.transform="translateY(20px)";
  setTimeout(function(){
    nameEl.textContent=cards[i].name;
    tagEl.textContent=cards[i].tag;
    descEl.textContent=cards[i].desc;
    nameEl.style.opacity=1; nameEl.style.transform="translateY(0)";
    tagEl.style.opacity=1; tagEl.style.transform="translateY(0)";
    descEl.style.opacity=1; descEl.style.transform="translateY(0)";
  },200);
}
document.getElementById("btnLeft").addEventListener("click",function(){
  idx=(idx-1+cards.length)%cards.length; render();
});
document.getElementById("btnRight").addEventListener("click",function(){
  idx=(idx+1)%cards.length; render();
});
build();
setTimeout(function(){
  var all=wrapper.querySelectorAll(".life-card");
  for(var i=0;i<all.length;i++){
    all[i].style.setProperty("--card-translateY-offset","0%");
  }
},200);
})();
</script>
