<div class="life-slider" id="lifeSlider">
  <div class="slider-bg" id="sliderBg"></div>
  <div class="card-area">
    <div class="cards-wrapper" id="cardsWrapper"></div>
  </div>
  <div class="info-area">
    <div class="info-text info-name" id="infoName"></div>
  </div>
  <button class="slider-btn btn-left" id="btnLeft" aria-label="Previous">
    <svg viewBox="0 0 24 24"><polyline points="15 4 7 12 15 20"/></svg>
  </button>
  <button class="slider-btn btn-right" id="btnRight" aria-label="Next">
    <svg viewBox="0 0 24 24"><polyline points="9 4 17 12 9 20"/></svg>
  </button>
</div>

<script>
(function(){
var cards=[
  {img:"/images/quick-gallery/drink.jpg",name:"喝酒"},
  {img:"/images/quick-gallery/bike.jpg",name:"骑车"},
  {img:"/images/quick-gallery/hotpot.jpg",name:"火锅"},
  {img:"/images/quick-gallery/hiking.jpg",name:"爬山"},
  {img:"/images/quick-gallery/disco.jpg",name:"蹦迪"},
  {img:"/images/quick-gallery/outdoor.jpg",name:"户外"},
  {img:"/images/quick-gallery/travel.jpg",name:"旅行"}
];
var idx=0;
var wrapper=document.getElementById("cardsWrapper");
var nameEl=document.getElementById("infoName");

function build(){
  cards.forEach(function(c,i){
    var div=document.createElement("div");
    div.className="life-card";
    if(i===0) div.classList.add("current");
    if(i===1) div.classList.add("next");
    if(i===cards.length-1) div.classList.add("prev");
    div.innerHTML='<img src="'+c.img+'" alt="'+c.name+'" loading="lazy">';
    wrapper.appendChild(div);
  });
  updateInfo(0);
}
function render(){
  var all=wrapper.querySelectorAll(".life-card");
  for(var i=0;i<all.length;i++){
    all[i].className="life-card";
    var pos=(i-idx+cards.length)%cards.length;
    if(pos===0) all[i].classList.add("current");
    if(pos===1) all[i].classList.add("next");
    if(pos===cards.length-1) all[i].classList.add("prev");
  }
  updateInfo(idx);
}
function updateInfo(i){
  nameEl.style.opacity=0; nameEl.style.transform="translateY(12px)";
  setTimeout(function(){
    nameEl.textContent=cards[i].name;
    nameEl.style.opacity=1; nameEl.style.transform="translateY(0)";
  },200);
}
document.getElementById("btnLeft").addEventListener("click",function(){
  idx=(idx-1+cards.length)%cards.length; render();
});
document.getElementById("btnRight").addEventListener("click",function(){
  idx=(idx+1)%cards.length; render();
});
build();
setTimeout(function(){
  var all=wrapper.querySelectorAll(".life-card");
  for(var i=0;i<all.length;i++){
    all[i].style.setProperty("--card-translateY-offset","0%");
  }
},200);
})();
</script>
